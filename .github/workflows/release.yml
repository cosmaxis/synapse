name: Release

# Tag push publishes; workflow_dispatch builds and checksums everything without
# touching the release, so the packaging path can be exercised before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the release job is granted write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Version gate ───────────────────────────────────────────────────────────
  #
  # Runs before the 4 builds so a mistyped tag costs seconds, not a full matrix.
  # A tag that disagrees with Cargo.toml would publish synapse-<tag>-<target>
  # assets under a version the installer resolves but cannot match, so this is
  # a hard failure rather than a warning.
  version:
    name: version gate
    runs-on:
      group: Default
      labels:
        - self-hosted
        - Linux
        - ARM64
        - mac-server
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: resolve and verify version
        id: v
        run: |
          set -euo pipefail
          # First `version =` in Cargo.toml is [package]'s; dependencies follow.
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "Cargo.toml version: $cargo_version"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "tag: $GITHUB_REF_NAME (version $tag_version)"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME implies version $tag_version but Cargo.toml says $cargo_version; bump Cargo.toml or retag"
              exit 1
            fi
          else
            echo "dry run: no tag, using Cargo.toml version"
          fi

          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  # ── Per-target build ───────────────────────────────────────────────────────
  #
  # All four legs run on the self-hosted ARM64 fleet; the two x86_64 targets
  # cross-compile (macOS via rustup target + clang, Linux via cargo-zigbuild).
  # GitHub-hosted runners are deliberately unused: the hosted pool starved
  # every release for ~8h until GitHub auto-cancelled the queued jobs.
  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            runner: macOS
            runs_on: '{"group":"Default","labels":["self-hosted","macOS","ARM64","mac-server"]}'
          - os: macos-15
            target: x86_64-apple-darwin
            runner: macOS
            cross: true
            runs_on: '{"group":"Default","labels":["self-hosted","macOS","ARM64","mac-server"]}'
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            runner: Linux
            runs_on: '{"group":"Default","labels":["self-hosted","Linux","ARM64","mac-server"]}'
          - os: ubuntu-22.04-arm
            target: x86_64-unknown-linux-gnu
            runner: Linux
            cross: true
            runs_on: '{"group":"Default","labels":["self-hosted","Linux","ARM64","mac-server"]}'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: runner host triple is aarch64 for this target's OS
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host: $host; target: ${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *-apple-darwin|*-unknown-linux-*)
              [ "${host%%-*}" = "aarch64" ] ;;
            *) exit 1 ;;
          esac

      - name: zig + cargo-zigbuild for Linux x86_64 cross
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          # Fleet runners are persistent: this installs once, later runs skip.
          command -v cargo-zigbuild >/dev/null \
            || cargo install cargo-zigbuild --locked
          if ! command -v zig >/dev/null; then
            zig_json="$(curl -fsSL https://ziglang.org/download/index.json)"
            zig_ver="$(printf '%s' "$zig_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["master"]["version"])')"
            curl -fsSL "https://ziglang.org/download/${zig_ver}/zig-linux-aarch64-${zig_ver}.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p "$HOME/.local/zig"
            tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
            rm /tmp/zig.tar.xz
            echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          fi
          rustup target add x86_64-unknown-linux-gnu

      - name: rust target for macOS x86_64 cross
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: cargo build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            # .2.35 keeps the glibc baseline identical to the old ubuntu-22.04
            # hosted build; zig supplies the cross libc and linker.
            cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.35
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # --target puts the binary under target/<triple>/release.
          bin="$(find target -path '*/release/synapse' -type f | head -1)"
          [ -n "$bin" ] || { echo "::error::synapse binary not found under target/"; exit 1; }
          # llvm-strip handles foreign-arch binaries where binutils strip may not.
          if command -v llvm-strip >/dev/null; then
            strip_bin=llvm-strip
          else
            rustup component add llvm-tools >/dev/null
            strip_bin="$(find "$(rustc --print sysroot)" -name llvm-strip -type f | head -1)"
          fi
          "${strip_bin:-strip}" -x "$bin"
          tarball="synapse-${VERSION}-${TARGET}.tar.gz"
          # -C means the archive holds exactly one member, `synapse`, at root.
          tar -czf "$tarball" -C "$(dirname "$bin")" synapse
          tar -tzf "$tarball"
          ls -lh "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}
          if-no-files-found: error

  # ── Collect, checksum, publish ─────────────────────────────────────────────
  release:
    name: publish release
    needs: [version, build]
    runs-on:
      group: Default
      labels:
        - self-hosted
        - Linux
        - ARM64
        - mac-server
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # merge-multiple flattens all 4 artifacts into dist/ with no per-artifact
      # subdirectories, which is what keeps checksums.txt filenames bare.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          ls -1
          # Run from inside dist/ with a bare glob so sha256sum records bare
          # filenames; the installer matches on the `-<target>.tar.gz` suffix.
          sha256sum synapse-*.tar.gz > checksums.txt
          cat checksums.txt
          count="$(wc -l < checksums.txt | tr -d ' ')"
          [ "$count" = 4 ] || { echo "::error::expected 4 tarballs, found $count"; exit 1; }
          sha256sum -c checksums.txt

      # Package versions come from the flake rather than being hardcoded here,
      # so release notes always report the selected platform's package versions.
      - uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          herdr="$(nix eval --raw '.#herdr.version')"
          omp="$(nix eval --raw '.#omp.version')"
          skillshare="$(nix eval --raw '.#skillshare.version')"

          {
            echo "## Install"
            echo
            echo '```sh'
            echo 'curl -sfS https://synapse.cosmaxis.com/install | sh'
            echo '```'
            echo
            echo "## Managed packages"
            echo
            echo "| Package | Version |"
            echo "| --- | --- |"
            echo "| herdr | $herdr |"
            echo "| omp | $omp |"
            echo "| skillshare | $skillshare |"
            echo
            echo "## Changelog"
            echo
          } > notes.md

          if [ -f CHANGELOG.md ]; then
            # Capture everything under `## [<version>]` up to the next `## [`.
            section="$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)"
          else
            section=""
          fi

          if [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$section" >> notes.md
          else
            echo "No changelog entry found for ${VERSION}." >> notes.md
          fi

          cat notes.md

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: synapse ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: |
            dist/synapse-*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
